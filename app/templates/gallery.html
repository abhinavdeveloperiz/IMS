{% extends 'base.html' %}
{% block title %}Gallery | Company Name{% endblock %}

{% block content %}
<section class="bg-white">
    <section class="relative h-[30vh] flex items-center justify-center bg-fixed bg-center bg-cover"
        style="background-image: linear-gradient(rgba(12,133,16,0.3), rgba(12,133,16,0.3)), url('https://plus.unsplash.com/premium_photo-1661963559074-9655a9404f1a?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Y29udGFpbmVyJTIwc2hpcHxlbnwwfHwwfHx8MA%3D%3D&fm=jpg&q=60&w=3000');">
        <div class="text-center text-white px-6">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">GALLERY</h1>
            <p class="text-lg text-gray-200">Home > Gallery</p>
        </div>
    </section>
    <div class="max-w-7xl mx-auto px-6 my-14">


        <!-- Image Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Repeat this block for each image -->
            <div class="relative group cursor-pointer">
                <img src="https://media.istockphoto.com/id/148992794/photo/container-terminal.jpg?s=612x612&w=0&k=20&c=pdCvMFOR5yZigDsWQD8neVFBt4Pde2ReF4lVIMhVBlc=" alt="Gallery Image"
                    class="w-full h-64 object-cover rounded-xl shadow-md transform group-hover:scale-105 transition duration-300"
                    onclick="openModal(this.src)">
            </div>
            <div class="relative group cursor-pointer">
                <img src="https://t4.ftcdn.net/jpg/04/48/93/89/360_F_448938910_WRtijsyMlLN5zN8kkkfsY8CKoMoXlQwv.jpg" alt="Gallery Image"
                    class="w-full h-64 object-cover rounded-xl shadow-md transform group-hover:scale-105 transition duration-300"
                    onclick="openModal(this.src)">
            </div>
            <div class="relative group cursor-pointer">
                <img src="https://media.istockphoto.com/id/2157040201/photo/truck-carrying-forty-foot-container-leaving-port-terminal-with-ship-and-quay-crane-on-the.jpg?s=612x612&w=0&k=20&c=D4UJJ09jrr-lkrP_6FvIAj6-2PosXIzg-iQ_HcxD0iQ=" alt="Gallery Image"
                    class="w-full h-64 object-cover rounded-xl shadow-md transform group-hover:scale-105 transition duration-300"
                    onclick="openModal(this.src)">
            </div>
            <div class="relative group cursor-pointer">
                <img src="https://png.pngtree.com/thumb_back/fh260/background/20231009/pngtree-stunning-3d-renderings-and-illustrations-of-container-cargo-ships-and-cargo-image_13579159.png" alt="Gallery Image"
                    class="w-full h-64 object-cover rounded-xl shadow-md transform group-hover:scale-105 transition duration-300"
                    onclick="openModal(this.src)">
            </div>
            <!-- Add more images as needed -->
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 hidden justify-center items-center z-50">
        <span class="absolute top-6 right-8 text-white text-3xl cursor-pointer" onclick="closeModal()">&times;</span>
        <img id="modalImage" class="max-h-[90vh] max-w-[90vw] rounded-lg shadow-lg border-4 border-white">
    </div>
</section>

<script>
    function openModal(src) {
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        modalImage.src = src;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeModal() {
        const modal = document.getElementById('imageModal');
        modal.classList.remove('flex');
        modal.classList.add('hidden');
    }

    // Close modal when clicking outside image
    window.addEventListener('click', function (e) {
        const modal = document.getElementById('imageModal');
        if (e.target === modal) {
            closeModal();
        }
    });
</script>
{% endblock %}
